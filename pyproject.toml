[project]
name = "grounded-voice-intelligence"
version = "0.1.0"
description = "Knowledge-grounded voice intelligence backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "qdrant-client>=1.9.0",
    "openai>=1.30.0",
    "deepgram-sdk>=3.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
