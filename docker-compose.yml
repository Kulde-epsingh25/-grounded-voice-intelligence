version: "3.8"

services:
  # --- Qdrant Vector Database ---
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # --- Backend API ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./evidence:/app/evidence
    restart: unless-stopped

volumes:
  qdrant_storage:
